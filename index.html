<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fera Smart Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .result-card:hover { transform: translateY(-2px); transition: all 0.2s; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <!-- Search Header -->
    <header class="bg-white shadow-sm sticky top-0 z-10 p-4">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row items-center gap-4">
            <h1 class="text-2xl font-bold text-blue-600 flex-shrink-0">Fera</h1>
            <div class="relative w-full">
                <input 
                    type="text" 
                    id="searchInput"
                    placeholder="Search anything..." 
                    class="w-full pl-4 pr-12 py-3 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent shadow-sm"
                >
                <button id="searchBtn" class="absolute right-4 top-3.5 text-gray-500 hover:text-blue-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 md:p-6">
        <!-- Results Info -->
        <div id="status" class="text-sm text-gray-500 mb-6 hidden"></div>

        <!-- Results Container -->
        <div id="resultsGrid" class="space-y-6">
            <!-- Initial State / Loader -->
            <div id="loader" class="hidden flex justify-center py-20">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
            </div>
        </div>
    </main>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsGrid = document.getElementById('resultsGrid');
        const status = document.getElementById('status');
        const loader = document.getElementById('loader');

        async function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            // UI Setup
            resultsGrid.innerHTML = '';
            loader.classList.remove('hidden');
            status.classList.add('hidden');

            try {
                const response = await fetch(`https://himanshu-711-fera-smart-search-2.hf.space/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                renderResults(data);
            } catch (error) {
                console.error("Search failed:", error);
                resultsGrid.innerHTML = `<p class="text-red-500 text-center">Failed to fetch results. Please try again later.</p>`;
            } finally {
                loader.classList.add('hidden');
            }
        }

        function renderResults(data) {
            if (!data.results || data.results.length === 0) {
                resultsGrid.innerHTML = `<p class="text-gray-600 text-center">No results found for your query.</p>`;
                return;
            }

            status.innerText = `Found about ${data.count} results for "${data.query}"`;
            status.classList.remove('hidden');

            const resultsHtml = data.results.map(result => `
                <div class="result-card bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex flex-col md:flex-row gap-5">
                    ${result.image ? `
                        <div class="w-full md:w-48 h-32 flex-shrink-0">
                            <img src="${result.image}" alt="${result.title}" class="w-full h-full object-cover rounded-lg bg-gray-100">
                        </div>
                    ` : ''}
                    
                    <div class="flex-1 overflow-hidden">
                        <div class="flex items-center gap-2 mb-1">
                            <img src="${result.favicon}" onerror="this.src='https://www.google.com/s2/favicons?domain=${result.domain}'" class="w-4 h-4">
                            <span class="text-xs text-gray-500 truncate">${result.domain}</span>
                        </div>
                        <h3 class="text-xl font-semibold text-blue-700 hover:underline mb-2">
                            <a href="${result.url}" target="_blank" rel="noopener">${result.title}</a>
                        </h3>
                        <p class="text-sm text-gray-600 line-clamp-3 mb-3">
                            ${result.snippet}
                        </p>
                        <div class="flex items-center gap-3">
                            <span class="text-xs font-medium px-2 py-1 bg-blue-50 text-blue-600 rounded">Score: ${result.score}</span>
                            ${result.tags.map(tag => `<span class="text-xs text-gray-400">#${tag}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `).join('');

            resultsGrid.innerHTML = resultsHtml;
        }

        // Event Listeners
        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });
    </script>
</body>
</html>
